<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motors &amp; Generators: Interactive Lab</title>
<style>
:root{--bg:#f2f6f3;--card:#fff;--ink:#1c2b33;--mute:#5b6b73;--line:#d3ddd8;--red:#d6453d;--blue:#2f6fd0;--green:#2a9d58;--yellow:#e8a800;--accent:#2a9d58;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a1f;--card:#1b262d;--ink:#e8f0ee;--mute:#9fb0b6;--line:#2c3b43;--red:#ef6a60;--blue:#5b97ee;--green:#46c27a;--yellow:#ffc928;--accent:#46c27a}}
:root[data-theme="dark"]{--bg:#121a1f;--card:#1b262d;--ink:#e8f0ee;--mute:#9fb0b6;--line:#2c3b43;--red:#ef6a60;--blue:#5b97ee;--green:#46c27a;--yellow:#ffc928;--accent:#46c27a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:880px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{margin:0 0 14px;color:var(--mute)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tabs button:focus-visible,input:focus-visible,.crank:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
canvas{width:100%;height:auto;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{font-size:1rem;margin:0 0 8px}
label{display:flex;justify-content:space-between;font-size:.92rem;margin-top:10px}
label b{font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.meter{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.92rem}
.bar{flex:1;height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--yellow)}
.bar.g i{background:var(--green)}
.meter span:first-child{width:92px}
#why{margin:0;font-size:.95rem}
.hint{color:var(--mute);font-size:.85rem;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>Motors &amp; generators lab</h1>
<p class="sub">Twins working in reverse. Pick one, then change the sliders and watch what happens.</p>

<div class="tabs" role="group" aria-label="Choose a machine">
  <button id="bm" aria-pressed="true">Motor: electricity in, spinning out</button>
  <button id="bg" aria-pressed="false">Generator: spinning in, electricity out</button>
</div>

<div class="stage"><canvas id="c" width="720" height="380" role="img" aria-label="Animated wire loop spinning between a north and a south magnet"></canvas></div>

<div class="grid">
  <div class="panel">
    <h2>Controls</h2>
    <label for="inp"><span id="inpL">Battery voltage</span><b id="inpV"></b></label>
    <input id="inp" type="range" min="0" max="12" step="0.5" value="6">
    <label for="mag">Magnet strength<b id="magV"></b></label>
    <input id="mag" type="range" min="1" max="10" step="1" value="5">
    <label for="turns">Loops of wire<b id="turnsV"></b></label>
    <input id="turns" type="range" min="1" max="10" step="1" value="3">
    <p class="hint" id="hint"></p>
  </div>
  <div class="panel">
    <h2>Readouts</h2>
    <div class="meter"><span>Electricity</span><div class="bar"><i id="eBar"></i></div><b id="eTxt"></b></div>
    <div class="meter"><span>Spinning</span><div class="bar g"><i id="sBar"></i></div><b id="sTxt"></b></div>
    <h2 style="margin-top:16px">What’s happening?</h2>
    <p id="why"></p>
  </div>
</div>
</main>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let mode='motor',phi=0,omega=0,t0=performance.now(),wave=[],dots=0,emf=0,cur=0;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function setMode(m){
  mode=m;
  $('bm').setAttribute('aria-pressed',m==='motor');$('bg').setAttribute('aria-pressed',m==='gen');
  const i=$('inp');
  if(m==='motor'){$('inpL').textContent='Battery voltage';i.max=12;i.step=.5;i.value=6;
    $('hint').textContent='More volts, stronger magnets or more loops all make the fan spin faster.';}
  else{$('inpL').textContent='Crank speed';i.max=10;i.step=.5;i.value=4;
    $('hint').textContent='Crank faster, use stronger magnets or add loops to light the bulb brighter.';}
  wave=[];omega=m==='gen'?0:omega;upd();
}
$('bm').onclick=()=>setMode('motor');$('bg').onclick=()=>setMode('gen');
['inp','mag','turns'].forEach(id=>$(id).addEventListener('input',upd));
function upd(){
  $('inpV').textContent=mode==='motor'?$('inp').value+' V':$('inp').value+' / 10';
  $('magV').textContent=$('mag').value;$('turnsV').textContent=$('turns').value;
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function txt(s,x,y,col,size,al){ctx.fillStyle=col;ctx.font='700 '+size+'px "Trebuchet MS",system-ui,sans-serif';ctx.textAlign=al||'center';ctx.fillText(s,x,y)}

function frame(now){
  const dt=Math.min(.05,(now-t0)/1000);t0=now;
  const v=+$('inp').value,B=+$('mag').value,N=+$('turns').value;
  if(mode==='motor'){const target=v*B*N*0.11;omega+=(target-omega)*Math.min(1,dt*2.2);}
  else{omega=v*1.6;}
  phi+=omega*dt;
  // electricity: generator emf alternates; motor current ~ volts
  if(mode==='gen'){emf=B*N*omega*Math.sin(phi)*0.06;cur=Math.abs(emf);}
  else{emf=v;cur=v;}
  wave.push(mode==='gen'?emf:0);if(wave.length>180)wave.shift();
  dots+=(mode==='gen'?emf:v)*dt*6;
  draw(B,N,v);
  const eMax=mode==='gen'?B*N*16*0.06:12,sMax=mode==='gen'?16:12*10*10*0.11;
  $('eBar').style.width=Math.min(100,Math.abs(cur)/(mode==='gen'?10:12)*100)+'%';
  $('sBar').style.width=Math.min(100,omega/(mode==='gen'?16:Math.max(1,sMax))*100)+'%';
  $('eTxt').textContent=(mode==='gen'?Math.abs(emf).toFixed(1):v.toFixed(1))+' V';
  $('sTxt').textContent=(omega/6.283*60).toFixed(0)+' rpm';
  $('why').textContent=mode==='motor'
    ? (v===0?'No electricity, so no magnetic push. Turn up the battery!':'Current makes the loop a temporary magnet. The N and S magnets push and pull it around, so it spins and turns the fan.')
    : (v===0?'Nothing is spinning, so no electricity. Crank it!':'Spinning the loop makes its wires cut through the magnetic field. That pushes charges along the wire and lights the bulb. When the loop looks widest it cuts the field fastest.');
  requestAnimationFrame(frame);
}

function draw(B,N,v){
  const W=720,H=380,red=css('--red'),blue=css('--blue'),green=css('--green'),yel=css('--yellow'),ink=css('--ink'),mute=css('--mute'),line=css('--line');
  ctx.clearRect(0,0,W,H);
  const cx=300,cy=215,mh=170,mw=64;
  // field lines
  ctx.strokeStyle=mute;ctx.globalAlpha=.35;ctx.lineWidth=1.5;
  const lines=Math.round(2+B*0.7);
  for(let k=0;k<lines;k++){const y=cy-mh/2+12+k*(mh-24)/(lines-1||1);ctx.beginPath();ctx.moveTo(cx-130+mw/2-34,y);ctx.lineTo(cx+130-mw/2+34,y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx+14,y-5);ctx.lineTo(cx+4,y);ctx.lineTo(cx+14,y+5);ctx.stroke();}
  ctx.globalAlpha=1;
  // magnets
  rr(cx-190,cy-mh/2,mw+10,mh,10);ctx.fillStyle=red;ctx.fill();txt('N',cx-190+(mw+10)/2,cy+12,'#fff',36);
  rr(cx+126,cy-mh/2,mw+10,mh,10);ctx.fillStyle=blue;ctx.fill();txt('S',cx+126+(mw+10)/2,cy+12,'#fff',36);
  // axle
  ctx.strokeStyle=ink;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx,cy-95);ctx.lineTo(cx,cy+95);ctx.stroke();
  // loop (projected width)
  const w=Math.sin(phi)*72,top=cy-62,bot=cy+62;
  ctx.lineWidth=3+Math.min(3,N*.3);ctx.lineJoin='round';
  ctx.strokeStyle=mode==='gen'?yel:green;
  for(let k=0;k<Math.min(N,5);k++){const o=k*4;ctx.beginPath();ctx.moveTo(cx-w,top+o);ctx.lineTo(cx+w,top+o);ctx.lineTo(cx+w,bot-o);ctx.lineTo(cx-w,bot-o);ctx.closePath();ctx.stroke();}
  // moving charges on the cutting sides
  const dir=mode==='gen'?Math.sign(Math.sin(phi)||1)*Math.sign(emf||1):1;
  ctx.fillStyle=yel;
  const nd=Math.min(8,Math.round(cur*0.8));
  for(let k=0;k<nd;k++){const p=((dots*dir*0.15+k/nd)%1+1)%1;
    ctx.beginPath();ctx.arc(cx+w,top+10+p*(bot-top-20),4.5,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(cx-w,bot-10-p*(bot-top-20),4.5,0,7);ctx.fill();}
  // lead wires to device on the right
  ctx.strokeStyle=line;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,cy-95);ctx.lineTo(cx,cy-120);ctx.lineTo(560,cy-120);ctx.lineTo(560,cy-70);ctx.stroke();
  ctx.beginPath();ctx.moveTo(cx,cy+95);ctx.lineTo(cx,cy+120);ctx.lineTo(560,cy+120);ctx.lineTo(560,cy+70);ctx.stroke();
  if(mode==='motor'){
    // battery
    rr(520,cy-70,80,140,10);ctx.fillStyle=css('--card');ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle=green;rr(526,cy+70-6-Math.max(4,v/12*120),68,Math.max(4,v/12*120),6);ctx.fill();
    txt('+',560,cy-48,ink,22);txt(v.toFixed(1)+' V',560,cy+6,ink,18);txt('Battery',560,cy+100+30,mute,14);
    // fan on left top: drawn bottom center
    fan(110,60,phi*1.0,green);txt('Fan',110,118,mute,14);
  }else{
    // bulb
    const br=Math.min(1,cur/10);
    const g=ctx.createRadialGradient(560,cy,6,560,cy,24+br*70);
    g.addColorStop(0,'rgba(255,214,60,'+(0.15+br*.85)+')');g.addColorStop(1,'rgba(255,214,60,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(560,cy,24+br*70,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(560,cy,30,0,7);ctx.fillStyle='rgba(255,210,50,'+(0.15+br*.85)+')';ctx.fill();ctx.strokeStyle=ink;ctx.lineWidth=3;ctx.stroke();
    ctx.fillRect(548,cy+28,24,10);txt('Bulb',560,cy+150,mute,14);
    // crank handle
    ctx.strokeStyle=mute;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx,cy-95);ctx.lineTo(cx,cy-110);ctx.stroke();
    const hx=110+Math.cos(phi)*30,hy=70+Math.sin(phi)*30;ctx.beginPath();ctx.arc(110,70,30,0,7);ctx.lineWidth=2;ctx.strokeStyle=line;ctx.stroke();
    ctx.beginPath();ctx.moveTo(110,70);ctx.lineTo(hx,hy);ctx.lineWidth=5;ctx.strokeStyle=ink;ctx.stroke();ctx.beginPath();ctx.arc(hx,hy,8,0,7);ctx.fillStyle=green;ctx.fill();
    txt('Crank',110,118,mute,14);
    // waveform
    const wx=18,wy=300,ww=190,wh=60;rr(wx,wy-wh/2-8,ww+16,wh+30,8);ctx.fillStyle=css('--bg');ctx.fill();
    ctx.strokeStyle=line;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(wx+8,wy);ctx.lineTo(wx+ww+8,wy);ctx.stroke();
    ctx.strokeStyle=yel;ctx.lineWidth=2.5;ctx.beginPath();
    wave.forEach((e,i)=>{const x=wx+8+i/180*ww,y=wy-e/10*wh/2;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();
    txt('Voltage over time',wx+8,wy+wh/2+12,mute,12,'left');
  }
  txt(mode==='motor'?'Electricity in → spinning out':'Spinning in → electricity out',W/2,28,ink,18);
}
function fan(x,y,a,col){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle=col;
  for(let k=0;k<3;k++){ctx.rotate(2.094);ctx.beginPath();ctx.ellipse(0,-26,10,24,0,0,7);ctx.fill();}
  ctx.beginPath();ctx.arc(0,0,7,0,7);ctx.fillStyle=css('--ink');ctx.fill();ctx.restore();
}
setMode('motor');requestAnimationFrame(frame);
</script>
</body>
</html>
